# Desktop builds of a release: Linux, Windows and macOS archives, built from this public source on GitHub's machines
# and attached to the DRAFT release of the tag. The Android APK is NOT built here: it is signed with the project's
# release key, which never leaves the maintainer's machine; the maintainer adds the APK, SHA256SUMS and latest.json
# (release/make-latest.py) to the draft and publishes it.
#
#   git tag v1.2.3 && git push origin v1.2.3        → builds + draft release
#   "Run workflow" (manual)                         → builds only, archives kept as workflow artifacts
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: create the draft release if the tag has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Janzeer Wallet ${GITHUB_REF_NAME#v}" --notes "Draft: desktop builds are being attached."
  desktop:
    needs: draft
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux }      # an older glibc: the archive runs on more distributions
          - { os: windows-latest, target: windows }
          - { os: macos-latest, target: macos }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: wallet
    steps:
      - uses: actions/checkout@v4
        with:
          path: wallet
      - uses: actions/checkout@v4
        with:
          repository: janzeerOrg/janzeer-sdk-dart
          path: sdk_dart
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - run: ./release/build-wallet.sh ${{ matrix.target }}
      - run: ls -la build/release && cat build/release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: janzeer-wallet-${{ matrix.target }}
          path: wallet/build/release/janzeer-wallet-*
          if-no-files-found: error
      - name: attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber build/release/janzeer-wallet-*
